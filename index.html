
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Screener PRO — Web</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📈</span>
      <span class="brand-name">Stock Screener <span class="pro">PRO</span></span>
    </div>
    <button class="btn-nav" id="btn-ir-cartera">💼 Mi Cartera</button>
  </header>

  <main id="vista-home" class="vista">
    <section class="kpis-grid" id="kpis-globales">
      <div class="kpi-card skeleton"></div>
      <div class="kpi-card skeleton"></div>
      <div class="kpi-card skeleton"></div>
      <div class="kpi-card skeleton"></div>
      <div class="kpi-card skeleton"></div>
    </section>

    <section class="top10-section">
      <div class="section-header">
        <h2>Top 10 — Mejor score del mercado</h2>
        <button class="btn-secondary" id="btn-ver-todo">Ver todo →</button>
      </div>
      <div id="top10-container" class="ranking-list">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
    </section>
  </main>

  <main id="vista-completa" class="vista oculto">
    <p>(Próximo paso: Screener completo con filtros)</p>
  </main>

  <main id="vista-cartera" class="vista oculto">
    <p>(Próximo paso: Cartera)</p>
  </main>

  <script>
    console.log('PASO 0: HTML cargado, a punto de cargar main.js como módulo');
  </script>
  <script type="module" src="js/main.js" onerror="console.error('PASO 0-ERROR: main.js no se pudo cargar como <script> tag')"></script>

</body>
</html>
