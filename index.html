
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Screener PRO — Web</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📈</span>
      <span class="brand-name">Stock Screener <span class="pro">PRO</span></span>
    </div>
    <button class="btn-nav" id="btn-ir-cartera">💼 Mi Cartera</button>
  </header>

  <main id="vista-home" class="vista">
    <section class="kpis-grid" id="kpis-globales">
      <div class="kpi-card skeleton"></div>
      <div class="kpi-card skeleton"></div>
      <div class="kpi-card skeleton"></div>
      <div class="kpi-card skeleton"></div>
      <div class="kpi-card skeleton"></div>
    </section>

    <section class="top10-section">
      <div class="section-header">
        <h2>Top 10 — Mejor score del mercado</h2>
        <button class="btn-secondary" id="btn-ver-todo">Ver todo →</button>
      </div>
      <div id="top10-container" class="ranking-list">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
    </section>
  </main>

  <main id="vista-completa" class="vista oculto">
    <div class="section-header">
      <button class="btn-secondary" id="btn-volver-home">← Volver</button>
      <h2>Screener completo</h2>
    </div>

    
    
    <div class="filtros-bar">
      <input type="text" id="buscador" placeholder="Buscar por ticker o nombre de empresa...">
      <div class="selects-fila">
        <select id="filtro-sector-select" class="select-pill"></select>
        <select id="filtro-industry-select" class="select-pill"></select>
        <select id="filtro-rating" class="select-pill">
          <option value="Todos">Todos los ratings</option>
          <option value="Excelente">Excelente</option>
          <option value="Buena">Buena</option>
          <option value="Neutral">Neutral</option>
          <option value="Débil">Débil</option>
          <option value="Evitar">Evitar</option>
        </select>
      </div>
    </div>



    <div id="tabla-completa-container"></div>
  </main>

  <main id="vista-cartera" class="vista oculto">
    <p>(Próximo paso: Cartera)</p>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
