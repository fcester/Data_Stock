
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Screener PRO — Web</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
  <div id="app-root">Cargando datos...</div>

  <script type="module">
    import { cargarTodosLosDatos } from './js/data-loader.js';

    async function iniciar() {
      const root = document.getElementById('app-root');
      try {
        const { screener, precios, fundamentales } = await cargarTodosLosDatos();
        root.innerHTML = `
          <h2>✅ Datos cargados correctamente</h2>
          <p>Tickers en Screener: ${screener.length}</p>
          <p>Filas de precios: ${precios.length}</p>
          <p>Filas de fundamentales: ${fundamentales.length}</p>
          <pre>${JSON.stringify(screener[0], null, 2)}</pre>
        `;
      } catch (err) {
        root.innerHTML = `<p style="color:red">Error cargando datos: ${err.message}</p>`;
        console.error(err);
      }
    }

    iniciar();
  </script>
</body>
</html>
