name: Actualizar datos financieros

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install yfinance pandas numpy scipy pyarrow

      - name: Ejecutar script
        run: python Total_Stock.py

      - name: Commit y push cambios
        uses: EndBug/add-and-commit@v9
        with:
          message: "📈 Actualización automática"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purgar cache de jsDelivr (para que la web app vea los datos nuevos ya mismo)
        run: |
          curl -s https://purge.jsdelivr.net/gh/fcester/Data_Stock@main/Actual_Stock.parquet
          curl -s https://purge.jsdelivr.net/gh/fcester/Data_Stock@main/Stock_Screener_PRO.csv
          curl -s https://purge.jsdelivr.net/gh/fcester/Data_Stock@main/Stock_Screener_History.parquet
          curl -s https://purge.jsdelivr.net/gh/fcester/Data_Stock@main/Stock_Advanced_Metrics.parquet
          curl -s https://purge.jsdelivr.net/gh/fcester/Data_Stock@main/stock_fundamentals_history.parquet
          curl -s https://purge.jsdelivr.net/gh/fcester/Data_Stock@main/Sector_Industry_Trends.parquet
          curl -s https://purge.jsdelivr.net/gh/fcester/Data_Stock@main/Tickers.csv
          echo "✅ Cache de jsDelivr purgado para todos los archivos de datos"

